# Truck source classification for the smoke-mod shared tree.
#
# Each entry maps a truck directory under
# _shared/vehicle/truck/{base_game,workshop}/ (and the matching
# _shared/vehicle/truck/upgrade/exhaust/{base_game,workshop}/ pool) to its
# source. The build packaging flattens these back to the SCS-expected
# /vehicle/truck/<truck>/ path, so the split is a source-tree organization
# only. See smoke-mod/README.md and docs/mod-smoke-variants.md.
#
# status = "confirmed"  -> solid evidence (launch truck, named dependency)
# status = "hypothesis" -> inferred from roster and naming convention
#
# Convention used: SCS base-game truck directories use plain names with no
# year suffix. Year-suffixed directories denote third-party model-year mods.
# The SCS modding wiki has no per-truck directory listing, so non-launch
# entries are hypotheses.

[trucks.intnational_9900i]
source = "base_game"
evidence = "International 9900i, official SCS ATS truck."
status = "hypothesis"

[trucks.intnational_lonestar]
source = "base_game"
evidence = "International LoneStar, official SCS ATS truck added in 2020."
status = "confirmed"

